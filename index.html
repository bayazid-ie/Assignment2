<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container py-4">
  <h3 class="mb-3 text-center">Drink Selector</h3>

  <!-- Search -->
  <div class="row mb-4">
    <div class="col-8 mx-auto d-flex gap-2">
      <input id="searchInput" class="form-control" placeholder="Search drink..." />
      <button id="searchBtn" class="btn btn-primary">Search</button>
    </div>
  </div>

  <div class="row">
    <!-- Left Column: Drink Cards -->
    <div class="col-8">
      <div id="drinkContainer" class="row g-3"></div>
      <p id="notFound" class="text-center text-danger mt-3 d-none">No drink found</p>
    </div>

    <!-- Right Column: Selected Group -->
    <div class="col-4">
      <div class="card">
        <div class="card-header bg-primary text-white">Selected Drinks</div>
        <div class="card-body">
          <p>Total Selected: <strong id="count">0</strong>/7</p>
          <div id="selectedList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Details Modal -->
<div class="modal fade" id="drinkModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
